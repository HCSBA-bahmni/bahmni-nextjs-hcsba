name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  security-events: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run inventory:legacy:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e -- --project=chromium --project=firefox
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.spdx.json }
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: hcsba/bahmni-next-web:0.1.0-rc.0 }
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: hcsba/bahmni-next-web:0.1.0-rc.0
          format: sarif
          output: trivy.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: trivy.sarif }
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: hcsba/bahmni-next-web:0.1.0-rc.0
          format: table
          severity: "HIGH,CRITICAL"
          exit-code: "1"
  edge:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install msedge
      - run: npm run e2e -- --project=edge
